[package]
name = "directcut-rs"
version = "1.2.0"
edition = "2024"
license = "MIT"

[features]
freshen-demo = ["dep:url"]

[dependencies]
serde = { version = "1", features = ["derive"] }
toml = "0.9"
rodio = { version = "0.20.1", default-features = false, features = ["mp3"] }
rungui = "0.4.0"
sha2 = "0.10"
symphonia = { version = "0.5.5", default-features = false, features = ["mp3", "mp2", "aac"] }
tempfile = "3.27.0"

[target.'cfg(windows)'.dependencies]
base64 = "0.22"
freshen = { git = "https://github.com/Nick6489/freshen.git", rev = "778a649e17c7c5d71e01ea45e30ca805a14008f5" }
prismer = { version = "=0.1.6", features = ["static"] }
pulldown-cmark = { version = "0.13", default-features = false }
url = { version = "2", optional = true }
windows = { version = "0.54", features = [
  "Win32_Foundation",
  "Win32_Graphics_Gdi",
  "Win32_System_DataExchange",
  "Win32_System_LibraryLoader",
  "Win32_UI_Shell",
  "Win32_UI_WindowsAndMessaging",
] }

[build-dependencies]
embed-resource = "3.0.12"
