[package]
name = "directcut-rs"
version = "1.1.0"
edition = "2024"
license = "MIT"

[features]
freshen-demo = ["dep:url"]

[dependencies]
rodio = { version = "0.20.1", default-features = false, features = ["mp3"] }
rungui = "0.4.0"
sha2 = "0.10"
symphonia = { version = "0.5.5", default-features = false, features = ["mp3"] }
tempfile = "3.27.0"

[target.'cfg(windows)'.dependencies]
base64 = "0.22"
freshen = { git = "https://github.com/Nick6489/freshen.git", rev = "778a649e17c7c5d71e01ea45e30ca805a14008f5" }
url = { version = "2", optional = true }
windows = { version = "0.54", features = [
  "implement",
  "Win32_Foundation",
  "Win32_System_Com",
  "Win32_UI_Accessibility",
  "Win32_UI_WindowsAndMessaging",
] }
